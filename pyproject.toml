[project]
name = "ameli-cli"
version = "0.1.0"
description = "Download documents from your personal ameli account"
readme = "README.md"
authors = [{ name = "Christophe Benz", email = "christophe.benz@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.40", #
    "pydantic>=2.7",
    "requests>=2.31",
]

[dependency-groups]
dev = ["ruff>=0.5"]

[project.scripts]
ameli-cli = "ameli_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
